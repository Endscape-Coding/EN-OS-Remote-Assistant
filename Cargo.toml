[package]
name = "en-os-remote-assistant"
version = "0.3.1"
edition = "2024"

[dependencies]
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1.8", features = ["rt-multi-thread", "macros"] }
log = "0.4"
dotenvy = "0.15"
pretty_env_logger = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ashpd = { version = "0.13", features = ["screenshot", "tokio"] }
url = "2.5.8"
thiserror = "2.0.18"
zip = "8.1.0"
walkdir = "2.5.0"
chrono = "0.4.44"
enigo = "0.6.1"
anyhow = "1.0.102"
log4rs = "1.4.0"
